name: Bug report
description: Something isn't working as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please never include tokens, secrets or private calendar content.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a rule from … to … in "Busy only" mode
        2. Move an event in the source calendar
        3. …
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Where are you running Calendblade?
      options:
        - Hosted instance
        - Self-hosted (Docker)
        - Self-hosted (other)
        - Local development
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Activity log entries, error codes, server logs (redact anything sensitive).
