name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit & integration tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calendblade
          POSTGRES_PASSWORD: calendblade
          POSTGRES_DB: calendblade
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U calendblade" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SKIP_ENV_VALIDATION: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run i18n:check
      - run: bun run test
        env:
          TEST_DATABASE_URL: postgres://calendblade:calendblade@localhost:5433/calendblade_test
      - run: bun run build

  e2e:
    name: End-to-end (fixture provider)
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calendblade
          POSTGRES_PASSWORD: calendblade
          POSTGRES_DB: calendblade
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U calendblade" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway values for an isolated CI database; never real secrets.
      DATABASE_URL: postgres://calendblade:calendblade@localhost:5433/calendblade
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-0000000000000000
      BETTER_AUTH_URL: http://localhost:3100
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CONNECTION_STATE_SECRET: ci-only-connection-state-secret-000000000
      WEBHOOK_SECRET: ci-only-webhook-secret-0000000000000000000
      CRON_SECRET: ci-only-cron-secret
      EMAIL_TRANSPORT: log
      PROVIDER_FIXTURE: "1"
      DEV_MAGIC_LINK_ENDPOINT: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks CLI (free for any account type; the GitHub Action needs a
      # license key on organization repositories).
      - name: Scan history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 git /repo --redact --verbose

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
